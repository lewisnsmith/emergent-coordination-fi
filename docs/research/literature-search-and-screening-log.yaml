    raw_export_status: not_preserved
    disposition: "Measurement, null, validation, liquidity, crowding, and strategic-coordination controls included."
  - id: h6_h11_search
    systems: [OpenAlex, Crossref, NBER, FINRA_Foundation, Bank_of_England, FSB, IOSCO, SEC, NIST, W3C, DataCite]
    queries:
      - 'AI robo adviser trust reliance investment delegation randomized experiment'
      - 'AI investment management adoption assets under management capital markets survey'
      - 'simulation to real domain shift external validation calibration detection'
      - 'verified AI exposure rollout causal market impact difference in differences'
