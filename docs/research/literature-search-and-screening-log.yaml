  - "Raw search exports were not committed, so this snapshot does not claim fully reproducible PRISMA flow counts."
  - "Many 2025-2026 sources are working papers or preprints; their conclusions remain provisional."
  - "Only the named artifact candidates received repository-level inspection; no full empirical reproduction was completed."
  - "No author or regulator was contacted."
