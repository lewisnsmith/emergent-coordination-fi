    retrieval_count_status: not_recorded
    raw_export_status: not_preserved
    disposition: "Human preference evidence, official adoption measurements, transport methods, exposure constraints, and release standards included."
  - id: h8_h13_search
    systems: [arXiv, ACL_Anthology, OpenReview, NeurIPS, Hugging_Face, GitHub]
    queries:
      - 'LLM rationale faithfulness causal cue perturbation input attribution'
      - 'activation patching causal tracing ablation steering SAE cross model transfer'
      - 'LLM pressure urgency emotion forced choice abstention sycophancy safety'
      - 'LLM quantization reasoning depth error propagation long context precision'
