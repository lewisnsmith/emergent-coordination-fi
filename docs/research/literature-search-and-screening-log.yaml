unresolved_queue:
  - {id: finchain_license, priority: high, action: "Ask the FinChain authors to add or identify code and template licenses before reuse."}
  - {id: financereasoning_artifact, priority: high, action: "Locate and audit the exact repository, license, inherited lineage, and generated solution provenance."}
  - {id: direct_precedent_artifacts, priority: high, action: "Request code, prompts, exact endpoints, exclusions, raw market/session outputs, and licenses for the 2026 direct LLM-finance working papers."}
  - {id: h7_denominator, priority: high, action: "Seek a verified time series of AI investment discretion, exposed assets, or order flow with a stable denominator; none was identified."}
  - {id: h10_exposure, priority: high, action: "Seek operational deployment records plus quantified exposure and a credible counterfactual; marketing claims do not qualify."}
  - {id: investlogicbench_artifacts, priority: medium, action: "Audit release provenance, privacy, independent units, selection, license, and reproducibility."}
  - {id: non_english_fulltext, priority: medium, action: "Translate any future non-English direct, adoption, or regulatory record that could change a claim or control."}

exclusions_and_downgrades:
  - {family: performance_only_agents, examples: [TradingAgents, ATLAS, MarketSenseAI, QuantAgents], reason: "No central matched convergence, ecology, or validated market-consequence estimand; retain only named reusable methods."}
  - {family: informal_adoption_claims, reason: "Vendor marketing, news summaries, speeches, and unsupported AUM estimates cannot establish H7 exposure."}
  - {family: ai_causation_without_exposure, reason: "A pattern or detector score without verified exposure and counterfactual is H9 resemblance, not H10 causation."}
  - {family: perplexity_only_quantization, reason: "No reasoning, behavior, or mechanism implication."}
  - {family: rationale_only_mechanisms, reason: "Generated explanations do not establish causal internal computation."}
  - {family: recent_unverified_working_papers, reason: "Keep in the horizon or unresolved queue until version, artifacts, license, independent unit, and validity can be checked."}

limitations:
  - "This is a broad open-first decision audit, not a claim that every extant paper was found."
