    - adoption_forecasting
    - prompt_pressure
    - black_box_attribution
    - mechanistic_interpretability
    - local_frontier_equivalence
    - quantization
    - financial_reasoning
    - statistical_design
    - transport_and_detection
    - verified_exposure_and_causal_inference
    - alpha_validation
