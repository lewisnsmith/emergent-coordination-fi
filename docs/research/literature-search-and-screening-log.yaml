    - provider_reproducibility_and_regulation

calibration:
  records: 50
  screeners: [agent_a, agent_b, agent_c]
  agreement: "All screeners retained every sentinel for at least one program lane. Differences concerned ring and permitted-use strength, not retrieval or global relevance."
  adjudications:
    - "Systematic reviews are discovery-only and cannot support empirical conclusions."
    - "Direct topic match does not imply design match or substitution eligibility."
    - "Governance sources define controls and motivation, not empirical AI-market effects."
    - "Public financial benchmarks are enabling artifacts and contamination-sensitive ecological bridges."
    - "No source qualifies for full_substitute in this snapshot."

search_runs:
  - id: repo_sentinel_reconciliation
    systems: [paper/references.bib, prior_screening_log]
    query: "all bibliography keys and all prior screening records"
    retrieved: 36
    raw_export_status: repository_sources_preserved
    result: "35 bibliography work families plus quantagents2025; all reconciled below."
  - id: direct_llm_finance
    systems: [arXiv, ACL_Anthology, SSRN, NBER, OpenReview, publisher_records]
    queries:
      - 'site:arxiv.org LLM trading agents convergence market homogeneous heterogeneous classical algorithms 2025 2026'
      - 'site:ssrn.com LLM investment recommendations convergence portfolio overlap 2025 2026'
      - 'site:aclanthology.org LLM trading agent financial markets simulation herding convergence'
      - 'site:nber.org "AI Managed Household Portfolios"'
      - 'site:arxiv.org 2026 LLM investment portfolio recommendations risk tolerance convergence'
    retrieval_count_status: not_recorded
    raw_export_status: not_preserved
    disposition: "Direct precedents and static-advice extensions included; performance-only systems excluded from the convergence core."
  - id: h1_h5_foundations
    systems: [Crossref, NBER, AEA, Oxford_Academic, Wiley, ScienceDirect, SEC, CFTC, USGS]
    queries:
      - 'institutional herding LSV Sias Wermers Wylie structural measurement'
      - 'algorithmic monoculture outcome homogenization correlated errors shared models'
      - 'agent based financial market double auction validation liquidity impact volatility'
      - 'algorithmic tacit collusion pricing market makers reinforcement learning'
      - 'strategy crowding fire sales liquidity commonality cascades systemic risk'
      - 'Flash Crash 2010 algorithmic trading liquidity primary official report CFTC SEC'
      - 'ODD protocol agent based model Grimm 2020 DOI primary'
