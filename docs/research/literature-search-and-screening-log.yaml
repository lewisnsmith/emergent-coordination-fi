living_review:
  fast_lane_refresh: monthly
  fast_lanes: [llm_trading, prompt_pressure, black_box_attribution, mechanistic_interpretability, local_frontier, quantization]
  other_lane_refresh: quarterly
  mandatory_refresh_points: [before_preregistration, before_collection_reduction, before_submission]
  preserve_prior_snapshots: true

protocol:
  review_type: prisma_compatible_scoping_evidence_map
  reporting_guidance:
    - https://www.prisma-statement.org/scoping
    - https://www.prisma-statement.org/prisma-search
  discovery_languages: all
  conclusion_sources: primary_scholarly_or_authoritative_method_transparent
  open_first: true
  subscription_indexes_not_searched: [EconLit, PsycINFO, Scopus, Web of Science]
  discovery_systems:
    - OpenAlex
    - Crossref
    - arXiv
    - ACL Anthology
    - OpenReview
    - NeurIPS proceedings
    - PMLR
    - SSRN
    - RePEc and IDEAS
    - NBER
    - publisher and DOI records
    - SEC, CFTC, FINRA, Federal Reserve, FSB, BIS, IOSCO, NIST, W3C, and DataCite
    - GitHub, Hugging Face, Zenodo, OSF, and author repositories
  source_rings: [direct, correlated, enabling, horizon]
  permitted_uses: [method_only, prior_only, partial_substitute, full_substitute]
  consequence_tags: [novelty_pressure, design_change, control_required, artifact_candidate, cost_saver, risk_warning, contradiction, extension_candidate]
  include_when:
    - tests a registered or closely matched question
    - identifies a construct, confound, comparator, measurement problem, or required negative control
    - supplies a statistic, benchmark, dataset, model, tool, causal design, or governance requirement
    - changes a claim boundary, novelty judgment, safety judgment, or collection decision
  downgrade_or_exclude_when:
    - performance-only trading system with no relevant estimand, method, artifact, or control
    - marketing, commentary, leaderboard, or abstract without a stable primary record
    - real-market AI-causation claim without verified exposure and a credible counterfactual
    - quantization result limited to perplexity with no behavioral, reasoning, or mechanism implication
    - duplicate version retained only inside a work family
  stopping_rule: "Freeze a dated snapshot after all retrieved candidates receive an included, excluded, discovery-only, or unresolved disposition; preserve open citation, artifact, translation, and contact queues for the living review."
  no_contact_without_authorization: true

coverage:
  hypotheses: [H1, H2, H2b, H3, H4, H5, H6, H7, H8, H9, H10, H11, H12, H13]
