    retrieval_count_status: not_recorded
    raw_export_status: not_preserved
    disposition: "Causal-attribution, pressure, mechanism, quantization, financial-task, and contamination records included or placed in the horizon queue."
  - id: alpha_and_statistics
    systems: [Crossref, SSRN, NBER, publisher_records]
    queries:
      - 'equivalence TOST noninferiority cluster robust inference multiple testing'
      - 'Reality Check data snooping deflated Sharpe probability backtest overfitting'
      - 'cross section expected returns multiple testing transaction costs prospective validation'
    retrieval_count_status: not_recorded
    raw_export_status: not_preserved
    disposition: "Methods included; they constrain design and do not establish owned alpha."
  - id: openalex_lane_probe
    system: OpenAlex_API
    run_date: "2026-08-12"
    query_template: "search=<lane terms>&filter=from_publication_date:1960-01-01,to_publication_date:2026-08-12&per-page=50"
    lanes_queried: 21
    retrieval_count_status: not_recorded
    raw_exports_preserved: false
    limitation: "The API probes were used for discovery and coverage checks. Result counts and returned metadata were inspected, but no raw export was committed; the living refresh must archive future raw exports before claiming PRISMA-S-complete retrieval."

