version: 1
search_date: "2026-08-06"
timezone: "America/Los_Angeles"
review_scope: "LLM trading convergence, market simulation, algorithmic monoculture, H2/H5 comparators, local-to-frontier scaling, quantized reasoning, financial-chain propagation, and open mechanistic interpretability"
protocol:
  databases:
    - arXiv
    - ACL Anthology
    - NeurIPS Proceedings
    - PMLR and OpenReview proceedings
    - Oxford Academic
    - NBER
    - SSRN
    - publisher DOI records
  queries:
    - '"LLM trading" convergence experimental asset markets'
    - '"Machine Spirits" LLM asset markets'
    - '"Dissecting AI Trading"'
    - '"Can Large Language Models Trade" order book'
    - '"Agent Trading Arena"'
    - '"Monoculture or Multiplicity"'
    - '"algorithmic pricing and liquidity" securities markets'
    - '"fund manager herding" LSV measurement bias'
    - '"measuring mutual fund herding" structural approach'
    - '"Agentic Trading" survey'
    - '"observational scaling laws" language model performance small models frontier'
    - 'quantization reasoning model chain of thought error propagation'
    - 'quantized language model long context task performance'
    - 'financial reasoning executable chain benchmark FinChain FinQA DocFinQA'
    - 'open sparse autoencoder cross-model mechanistic universality'
  inclusion:
    - direct LLM trading or investment-recommendation experiments
    - measurement papers defining or auditing LSV/Sias-style herding
    - algorithmic monoculture or outcome-homogenization studies
    - market-design or learning papers that constrain H5 claims
    - systematic reviews with explicit search/evidence protocols
    - primary studies that separate model scale, precision, reasoning depth, or quantization method
    - financial benchmarks with executable programs, step labels, or long-document controls
    - open mechanistic resources and cross-family transfer studies that constrain H8/H13 claims
  exclusion:
    - performance-only trading agents without a convergence, ecology, measurement, or market-design implication
    - commentary without a stable primary record
    - real-market AI-causation claims lacking verified exposure and a counterfactual
    - quantization claims based only on perplexity when no reasoning, behavior, or mechanism implication is available
  refresh_points:
    - before_preregistration
    - before_submission
  metadata_policy: "Prefer publisher/proceedings records; retain dated arXiv or SSRN identifiers for working papers."
  correction_policy: "Check publisher pages for linked errata/corrections; never infer a correction from an article DOI."

