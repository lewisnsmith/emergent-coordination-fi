  static: "Structure, documentation, corrections, leakage risks, and executable entry points inspected."
  smoke: "Pinned artifact executes a small deterministic example and reproduces its oracle."
  full: "Independent clean-environment reproduction matches the named claim and unit."

substitution_gate:
  required_for_partial_substitute:
    - stable_source_and_version
    - exact_artifact_and_commit
    - code_data_prompt_weight_licenses
    - upstream_provenance_and_redistribution_rights
    - comparable_population_treatment_comparator_estimand_outcome_and_unit
    - dependency_lock_and_runtime
    - deterministic_smoke_reproduction
    - leakage_and_correction_review
    - independence_and_split_review
  required_for_full_substitute:
    - all_partial_substitute_requirements
    - full_clean_environment_reproduction
    - external_validation
    - all_matched_and_unmatched_cells_named
  rule: "An open paper is not an open artifact. Missing or ambiguous rights fail closed."

