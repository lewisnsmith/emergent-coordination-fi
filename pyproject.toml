[project]
name = "flock-research-program"
version = "0.1.0"
description = "tracks the flock study families"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.2",
    "pyyaml>=6.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["program_checks"]
extend-exclude = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["program_checks"]
addopts = "-q"
