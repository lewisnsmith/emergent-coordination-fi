schema_version: 1
policy_id: flock-strict-grounding-v1
default_enforcement_mode: strict_fail_closed
purpose: Prevent unsupported model output from being treated as verified evidence, executable advice, causal explanation, or publishable fact.
assurance_boundary:
  guarantee_claim_allowed: false
  statement: No LLM can be guaranteed never to hallucinate; this policy makes supplied evidence machine-addressable, validates deterministic claims, quarantines failures, and exposes residual error rates.
  rationale_is_mechanistic_evidence: false
  llm_judge_can_be_sole_validator: false

enforcement_modes:
  strict_fail_closed:
    execute_orders_only_when_all_hard_response_gates_pass: true
    quarantine_failed_response: true
    preserve_raw_proposal_for_audit: true
    replace_with_hold_for_market_execution: true
    replacement_reason: safeguard_rejection
    primary_safety_mode: true
  observational_shadow:
    execute_orders: false
    preserve_raw_proposal_for_behavioral_measurement: true
    label_every_output_unverified: true
    allowed_use: [prompt_screening, adversarial_testing, failure_analysis]
    confirmatory_market_dynamics_allowed: false
  preregistered_behavioral_execution:
    execute_schema_valid_orders_even_if_rationale_grounding_fails: true
    preserve_grounding_failure_flag: true
    allowed_only_when_preregistered: true
    required_parallel_strict_run: true
    warning: This mode measures raw model behavior and must not be described as safe or grounded.

evidence_model:
  evidence_id_format: "{source_type}:{symbol_or_scope}:{timestamp}:{field}:{index_or_version}"
  allowed_source_types:
    - bar
    - price
    - event
    - portfolio
    - constraint
    - instrument
    - book
    - scenario
  required_evidence_record_fields:
    - evidence_id
    - source_type
    - observed_at
    - available_at_decision_time
    - value
    - unit
    - source_artifact_hash
  temporal_rules:
    available_at_decision_time_must_be_true: true
    event_timestamp_must_not_exceed_decision_timestamp: true
    outcome_or_resolution_hidden_until_publication_time: true
    future_derived_statistics_forbidden: true
  rendering_rules:
    stable_order: true
    canonical_numeric_representation: true
    explicit_units: true
    untrusted_text_is_delimited: true
    untrusted_text_cannot_change_instruction_hierarchy: true
    full_rendered_evidence_hash_required: true

response_contract:
  structured_output_required: true
  additional_fields_allowed: false
  required_fields:
    - orders
    - decision_summary
    - evidence_refs
    - confidence
    - uncertainty
    - constraint_checks
    - abstain
  orders:
    type: list
    item_required_fields: [symbol, side, quantity, limit_price, evidence_refs]
    symbol_must_be_from_observation: true
    side_allowed_values: [buy, sell]
    quantity_must_be_finite: true
    quantity_must_be_positive: true
    limit_price_must_be_null_or_finite_positive: true
    evidence_refs_minimum_per_nonempty_order: 1
  decision_summary:
    maximum_characters: 800
    hidden_chain_of_thought_requested: false
    use: concise_auditable_claim_summary_only
  evidence_refs:
    type: unique_list
    every_reference_must_resolve: true
    references_must_be_visible_to_agent: true
  confidence:
    minimum: 0.0
    maximum: 1.0
    units: probability_like_self_report_not_verified_probability
  uncertainty:
    required_even_when_confidence_is_high: true
    missing_information_must_not_be_invented: true
  constraint_checks:
    every_hard_constraint_must_be_addressed: true
    allowed_statuses: [pass, not_applicable, cannot_verify]
    cannot_verify_prevents_order_execution: true
  abstain:
    type: boolean
    if_true_orders_must_be_empty: true
    if_false_empty_orders_are_interpreted_as_hold: true

claim_grounding:
  factual_claim_coverage_required: 1.0
  claim_types_requiring_evidence:
    - numeric_market_fact
    - portfolio_fact
    - constraint_fact
    - event_or_news_fact
    - instrument_fact
    - comparative_market_claim
  claim_types_never_accepted_as_observed_fact:
    - unsupported_forecast
    - guarantee
    - private_information
    - unnamed_expert_claim
    - model_memory_claim
    - causal_claim_from_correlation
  numeric_validation:
    exact_match_for_supplied_integers: true
    absolute_tolerance: 0.000001
    relative_tolerance: 0.000001
    derived_value_requires_formula_id: true
    derived_value_inputs_must_be_cited: true
  text_validation:
    symbol_and_entity_allowlist_required: true
    event_claim_requires_matching_event_id: true
    paraphrase_may_not_reverse_polarity: true
  deterministic_validator_is_primary: true
  optional_secondary_review:
    independent_model_allowed: true
    blinded_to_provider_and_treatment: true
    disagreement_requires_human_or_deterministic_resolution: true
    cannot_override_deterministic_failure: true

prompt_injection_defense:
  instruction_precedence:
    - system_safety_and_research_rules
    - response_contract
    - investor_and_portfolio_constraints
    - experiment_treatment_text
    - untrusted_market_and_news_content
  untrusted_fields:
    - news_headline
    - news_body
    - issuer_text
    - social_text
    - external_document
  delimiters:
    opening: "<UNTRUSTED_MARKET_CONTENT>"
    closing: "</UNTRUSTED_MARKET_CONTENT>"
  detection_patterns:
    - instruction_to_ignore_prior_rules
    - instruction_to_reveal_system_prompt
    - instruction_to_change_response_schema
    - instruction_to_trade_specific_symbol_without_evidence
    - encoded_or_obfuscated_instruction
    - fake_authority_or_tool_output
  policies:
    preserve_original_text_hash: true
    never_execute_content_as_instruction: true
    detected_injection_is_logged: true
    strict_mode_rejects_response_that_follows_injection: true
    adversarial_experiment_requires_explicit_treatment_id: true

provenance_gates:
  before_run:
    - id: config-resolved
      requirement: All references resolve and the fully expanded configuration is content hashed.
      severity: hard_fail_run
    - id: dataset-complete
      requirement: Every required dataset artifact exists, matches its manifest hash, and passes schema validation.
      severity: hard_fail_run
    - id: dataset-provenance
      requirement: Source, retrieval time, license, builder parameters, and all payload hashes are recorded.
      severity: hard_fail_run
    - id: no-future-leakage
      requirement: Every evidence item was available by the decision timestamp.
      severity: hard_fail_run
    - id: model-verified
      requirement: Provider, exact model ID or checkpoint revision, frontier eligibility, and verification date are recorded.
      severity: hard_fail_run
    - id: prompt-snapshot
      requirement: System, task, profile, treatment, evidence rendering, and response contract are separately hashed.
      severity: hard_fail_run
    - id: assignment-frozen
      requirement: Randomization assignments and independent block IDs are written before provider calls.
      severity: hard_fail_run
  per_call:
    required_hashes:
      - expanded_config_hash
      - dataset_bundle_hash
      - model_spec_hash
      - system_prompt_hash
      - task_prompt_hash
      - profile_hash
      - treatment_hash
      - evidence_hash
      - full_request_hash
      - raw_response_hash
      - normalized_response_hash
    required_metadata:
      - run_id
      - study_id
      - hypothesis_ids
      - independent_block_id
      - agent_id
      - provider
      - exact_model_id
      - checkpoint_or_api_revision
      - model_parameters
      - request_id_if_available
      - cache_status
      - attempt_count
      - token_usage
      - latency
      - validator_version
  after_run:
    - id: artifact-completeness
      requirement: Planned and realized agent-step counts reconcile, including failures and retries.
      severity: hard_fail_release
    - id: cost-reconciliation
      requirement: Manifest token and cost totals equal the per-call usage ledger.
      severity: hard_fail_release
    - id: ledger-reconciliation
      requirement: Orders, fills, fees, cash, positions, and equity reconcile exactly within declared tolerances.
      severity: hard_fail_release
    - id: immutable-results
      requirement: Every result artifact has a final hash and no completed run directory was overwritten.
      severity: hard_fail_release

logical_quality_gates:
  hard_response_gates:
    - valid_structured_output
    - no_unknown_symbol
    - no_nonfinite_number
    - no_negative_or_zero_quantity
    - every_evidence_reference_resolves
    - every_factual_claim_is_supported
    - no_future_or_hidden_information
    - no_followed_prompt_injection
    - no_hard_constraint_violation
    - order_is_feasible_given_cash_inventory_and_position_limits
    - abstention_and_orders_are_logically_consistent
  analysis_gates:
    - intended_and_executable_orders_are_both_retained
    - parse_failure_is_distinguished_from_voluntary_hold
    - safeguard_rejection_is_distinguished_from_voluntary_hold
    - raw_and_safe_execution_outcomes_are_not_conflated
    - per_symbol_actions_are_used_for_per_symbol_claims
    - agent_calls_are_not_counted_as_independent_market_evidence
    - treatment_assignments_match_rendered_hashes
    - same_and_different_factor_claims_pass_hash_audit
    - multiplicity_family_matches_preregistration
    - equivalence_requires_TOST_not_nonsignificance
  interpretation_gates:
    - no_profit_guarantee_language
    - no_real_world_investment_advice_label
    - no_causal_language_for_detection_only_results
    - no_population_claim_from_unweighted_prompt_families
    - no_mechanistic_claim_from_rationale_text
    - no_AI_causation_claim_without_verified_exposure_and_identification_design

failure_taxonomy:
  parse_failure: Response cannot be normalized into the response contract.
  schema_violation: Response has missing, additional, or invalid structured fields.
  fabricated_entity: Response names a symbol, event, person, source, or instrument absent from evidence.
  fabricated_number: Response states a number not supplied or validly derived from cited evidence.
  unsupported_claim: A factual statement has no resolving evidence reference.
  temporal_leakage: Response relies on information unavailable at decision time.
  prompt_injection_followed: Response obeys an instruction contained in untrusted evidence.
  constraint_violation: Proposed order violates a hard investor or market constraint.
  logical_inconsistency: Orders, abstention, cited evidence, or constraint checks contradict one another.
  unsupported_certainty: Confidence or guarantee language is not justified by the evidence contract.
  provider_failure: Provider request does not complete under the preregistered retry policy.

quality_thresholds:
  accepted_response:
    hard_gate_failures: 0
    evidence_reference_resolution_rate: 1.0
    factual_claim_grounding_rate: 1.0
    hard_constraint_pass_rate: 1.0
  accepted_run:
    missing_agent_step_rate: 0.0
    provenance_completeness_rate: 1.0
    assignment_hash_match_rate: 1.0
    ledger_reconciliation_rate: 1.0
    unreported_exclusion_count: 0
  publication:
    verification_status_required: pass
    residual_failure_rates_reported: true
    all_exclusions_reported: true
    limitations_and_assurance_boundary_included: true

required_artifacts:
  - evidence_catalog.parquet
  - request_provenance.jsonl
  - raw_response_audit.jsonl
  - grounding_verdicts.parquet
  - injection_events.parquet
  - logical_gate_failures.parquet
  - run_verification.json
  - release_verification.json
