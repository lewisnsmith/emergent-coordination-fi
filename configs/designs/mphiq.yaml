schema_version: 1
design_id: mphiq-full-factorial-v1
title: Model, profile, harness, information, and prompt sameness design
bit_order: [M, P, H, I, Q]
bit_semantics:
  1: same_is_true
  0: different_is_true
code_format: five_character_binary_string

dimensions:
  M:
    name: model
    same_definition: Every assigned agent uses the same resolved provider, model checkpoint or API model ID, and revision.
    different_definition: Agents are allocated across at least two eligible frontier models using the model balance rules.
    resolved_hash_fields: [provider, model_id, revision, endpoint_class, decoding_capabilities]
  P:
    name: investor_profile
    same_definition: Every assigned agent receives the same fully rendered investor profile and mandate.
    different_definition: Agents are allocated across at least two preregistered profiles using the profile balance rules.
    resolved_hash_fields: [profile_id, profile_version, rendered_profile, financial_constraints]
  H:
    name: harness
    same_definition: Every assigned agent uses the same resolved inference and memory harness.
    different_definition: Agents are allocated across at least two preregistered harness presets using the harness balance rules.
    resolved_hash_fields: [temperature, reasoning_effort, memory_mode, memory_window, max_output_tokens, structured_output_mode]
  I:
    name: information
    same_definition: Every agent receives byte-identical market evidence and event records before agent-specific portfolio state is attached.
    different_definition: Agents receive balanced deterministic evidence partitions with equal information budgets and no future leakage.
    resolved_hash_fields: [market_evidence_hash, event_partition_id, evidence_budget, cutoff_timestamp]
    excluded_from_sameness_hash: [agent_id, agent_portfolio, response_history]
  Q:
    name: prompt_wording
    same_definition: Every agent receives the same task wording after excluding the independently assigned profile and information blocks.
    different_definition: Agents receive balanced semantically equivalent task paraphrases; substantive prompt-family differences require a separate declared factor.
    resolved_hash_fields: [semantic_group, prompt_variant_id, rendered_task_frame, response_contract_version]

schemes:
  expected_count: 32
  entries:
    - {code: "00000", M: 0, P: 0, H: 0, I: 0, Q: 0}
    - {code: "00001", M: 0, P: 0, H: 0, I: 0, Q: 1}
    - {code: "00010", M: 0, P: 0, H: 0, I: 1, Q: 0}
    - {code: "00011", M: 0, P: 0, H: 0, I: 1, Q: 1}
    - {code: "00100", M: 0, P: 0, H: 1, I: 0, Q: 0}
    - {code: "00101", M: 0, P: 0, H: 1, I: 0, Q: 1}
    - {code: "00110", M: 0, P: 0, H: 1, I: 1, Q: 0}
    - {code: "00111", M: 0, P: 0, H: 1, I: 1, Q: 1}
    - {code: "01000", M: 0, P: 1, H: 0, I: 0, Q: 0}
    - {code: "01001", M: 0, P: 1, H: 0, I: 0, Q: 1}
    - {code: "01010", M: 0, P: 1, H: 0, I: 1, Q: 0}
    - {code: "01011", M: 0, P: 1, H: 0, I: 1, Q: 1}
    - {code: "01100", M: 0, P: 1, H: 1, I: 0, Q: 0}
    - {code: "01101", M: 0, P: 1, H: 1, I: 0, Q: 1}
    - {code: "01110", M: 0, P: 1, H: 1, I: 1, Q: 0}
    - {code: "01111", M: 0, P: 1, H: 1, I: 1, Q: 1}
    - {code: "10000", M: 1, P: 0, H: 0, I: 0, Q: 0}
    - {code: "10001", M: 1, P: 0, H: 0, I: 0, Q: 1}
    - {code: "10010", M: 1, P: 0, H: 0, I: 1, Q: 0}
    - {code: "10011", M: 1, P: 0, H: 0, I: 1, Q: 1}
