balance_rules:
  general:
    assignment_scope: within_market_window_seed_scheme_cohort
    randomization: deterministic_seeded_block_randomization
    minimum_levels_when_different: 2
    maximum_level_count_difference: 1
    same_level_unique_hash_count: 1
    different_level_minimum_unique_hash_count: 2
    fixed_cohort_size_across_schemes: true
    fixed_total_capital_across_schemes: true
    preserve_level_counts_across_paired_schemes: true
    do_not_treat_agents_or_calls_as_independent_replicates: true
  joint_assignment:
    goal: Make zero-bit factors mutually orthogonal within a block whenever cohort size permits.
    preferred_method: balanced_complete_crossing
    fallback_method: seeded_near_orthogonal_assignment
    maximum_joint_cell_count_difference: 1
    report_pairwise_factor_association: true
    reject_if_any_zero_bit_is_perfectly_confounded: true
  model:
    apply_when: M_is_0
    balance_provider_families_first: true
    balance_models_within_provider_second: true
    require_frontier_eligibility: true
    same_provider_only_design_requires_explicit_subdesign: true
    local_and_api_model_counts_differ_by_at_most_one: true
  profile:
    apply_when: P_is_0
    balance_financial_objectives: true
    balance_risk_capacity: true
    balance_horizon: true
    separate_identity_only_from_financial_fact_treatments: true
    prohibit_implicit_stereotype_assignment: true
  harness:
    apply_when: H_is_0
    presets_must_be_preregistered: true
    only_compare_supported_parameters: true
    unsupported_provider_parameter_is_not_a_level: true
    memory_state_is_reset_at_block_start: true
  information:
    apply_when: I_is_0
    equal_evidence_item_count: true
    equal_token_budget_with_tolerance: true
    token_budget_tolerance_fraction: 0.02
    equal_timestamp_cutoff: true
    deterministic_partition_from_seed: true
    prohibit_outcome_and_future_leakage: true
    partition_overlap_must_be_reported: true
  prompt:
    apply_when: Q_is_0
    require_one_semantic_equivalence_group: true
    equal_allocation_across_paraphrases: true
    profile_and_information_text_excluded_from_Q_hash: true
    substantive_realistic_prompt_families_are_not_valid_Q_zero_levels: true

scheme_pairing:
  purpose: Estimate each bit effect by comparing schemes differing in exactly that bit.
  hamming_distance: 1
  require_shared_market_window_and_seed: true
  require_identical_nonflipped_assignments: true
  common_random_numbers: true
  flip_contrast_direction: "same_minus_balanced_different"

verification_gates:
  pre_run:
    - exactly_32_unique_codes
    - every_code_matches_MPHIQ_bits
    - every_one_bit_resolves_to_one_hash
    - every_zero_bit_resolves_to_at_least_two_hashes
    - all_zero_bit_level_counts_are_balanced
    - no_forbidden_factor_confounding
    - all_models_are_verified_frontier_models
    - all_information_cutoffs_are_leakage_safe
  post_run:
    - realized_assignments_match_plan
    - rendered_hashes_match_sameness_claims
    - every_agent_step_has_one_assignment_record
    - paired_schemes_have_complete_outcomes
    - exclusions_and_failures_are_reported_by_scheme

required_artifacts:
  - mphiq_plan.json
  - mphiq_assignments.parquet
  - mphiq_hash_audit.parquet
  - mphiq_balance.json
  - mphiq_effects.parquet
  - mphiq_verification.json
