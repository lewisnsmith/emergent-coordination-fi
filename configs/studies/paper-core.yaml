estimands:
  - estimand_id: h1-kappa-contrast
    hypothesis_id: H1
    outcome: Chance-corrected per-symbol action agreement.
    contrast: LLM technology minus matched classical technology within ecology and trajectory blocks.
    independent_unit: Independent trajectory or nonoverlapping market-window dependence cluster.
    estimator: Family-balanced paired contrast with cluster-aware small-sample inference.
  - estimand_id: h3-provider-contrast
    hypothesis_id: H3
    outcome: Pairwise decision and forecast-error agreement.
    contrast: Same-model and same-provider pairs minus provider-balanced cross-family pairs.
    independent_unit: Independent trajectory or nonoverlapping market-window dependence cluster.
    estimator: Blocked pair contrast with model-family cluster bootstrap and Holm correction.
  - estimand_id: h4-mphiq-effects
    hypothesis_id: H4
    outcome: Per-symbol agreement and constrained-oracle regret.
    contrast: Paired same-minus-different effect for each MPHIQ factor and locked interactions.
    independent_unit: Independent trajectory or nonoverlapping market-window dependence cluster.
    estimator: Full-factorial contrasts with paired Hamming-one comparisons and hierarchical FDR.
  - estimand_id: h5-capital-dose-response
    hypothesis_id: H5
    outcome: Impact, volatility, spread, depth, cascades, and convergence breadth.
    contrast: Each randomized AI-capital-share level minus the paired zero-AI market.
    independent_unit: Independently randomized whole-market replica.
    estimator: Paired dose-response curve with simultaneous threshold confidence band.

required_outputs:
  - output_id: frozen-plan
    path: results/paper-core/study-plan.json
    format: json
    estimand_ids: [h1-kappa-contrast, h3-provider-contrast, h4-mphiq-effects, h5-capital-dose-response]
  - output_id: h1-effects
