schema_version: 1
study_id: paper-core-v1
title: Matched-control study of LLM trading convergence and market impact
max_stages: 5

dependence_clusters:
  - cluster_id: synthetic-trend-family-v1
    independent_unit: trajectory
    description: Seeded trending trajectories analyzed as one synthetic regime family.
  - cluster_id: synthetic-reversal-family-v1
    independent_unit: trajectory
    description: Seeded mean-reverting trajectories analyzed as one synthetic regime family.
  - cluster_id: equities-2018-h1
    independent_unit: market_window
    description: Non-overlapping United States equity replay window for early 2018.
  - cluster_id: equities-2019-h2
    independent_unit: market_window
    description: Non-overlapping United States equity replay window for late 2019.
  - cluster_id: equities-2020-crisis
    independent_unit: market_window
    description: Pandemic crisis equity replay window with no overlap with adjacent windows.
  - cluster_id: equities-2022-bear
    independent_unit: market_window
    description: Inflation and tightening equity replay window during the 2022 bear market.
  - cluster_id: exchange-trend-family-v1
    independent_unit: market_replica
    description: Shared-exchange trending replicas randomized independently at market level.
  - cluster_id: exchange-stress-family-v1
    independent_unit: market_replica
    description: Shared-exchange stressed-liquidity replicas randomized at market level.

