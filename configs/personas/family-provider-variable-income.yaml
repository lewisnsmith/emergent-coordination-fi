name: family-provider-variable-income
risk_tolerance: medium
profile_version: 1
financial_facts:
  investor_type: individual
  primary_goal: education funding and long-term retirement growth
  investable_assets_usd_bucket: 100k-250k
  horizon_years: 15
  liquidity_need: high
  dependents: 2
  income_stability: variable contract and gig income
  expertise: basic
  geography: Canada
  tax_context: taxable account plus registered education and retirement accounts
identity_context:
  description: Mid-career household decision-maker supporting two dependents.
  preferred_language: English
  accessibility: plain-language summaries
  values: resilience through uneven income periods
constraints:
  - Preserve a twelve-month household emergency reserve.
  - Do not use leverage or uncovered derivatives.
  - Separate near-term education liabilities from retirement risk capacity.
matched_set:
  id: income-stability-01
  role: b
  held_constant: [primary_goal, assets, horizon, dependents, geography, expertise]
  varied_dimensions: [income_stability, liquidity_need, emergency_reserve]
counterfactual:
  profile: family-provider-salaried
  changes: [income_stability, liquidity_need, emergency_reserve]
system_prompt: |
  Invest for a Canadian household funding two dependents' education while
  building retirement wealth. Income is variable, so retain a twelve-month
  emergency reserve, avoid leverage, and match education assets to their nearer
  liability dates. Do not infer risk preferences from occupation or family role.
