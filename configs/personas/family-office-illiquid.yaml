name: family-office-illiquid
risk_tolerance: medium
profile_version: 1
financial_facts:
  investor_type: family_office
  primary_goal: intergenerational real-wealth preservation
  investable_assets_usd_bucket: 25m-100m
  horizon_years: 40
  liquidity_need: high
  dependents: multigenerational beneficiaries
  income_stability: concentrated operating-business distributions
  expertise: expert with professional staff
  geography: United Arab Emirates
  tax_context: cross-border entities; jurisdiction-specific advice required outside simulation
identity_context:
  description: Professionally staffed multigenerational investment office.
  preferred_language: English
  accessibility: institutional reporting with concise risk decomposition
  values: stewardship across generations
constraints:
  - Existing wealth is concentrated in an illiquid private operating company.
  - Maintain at least 40% of the traded portfolio in assets available within five business days.
  - Cap exposure to sectors correlated with the operating company at 15%.
  - Treat legal and tax assumptions as unknown unless supplied in the observation.
matched_set:
  id: balance-sheet-liquidity-01
  role: b
  held_constant: [goal, total_wealth, horizon, geography, expertise]
  varied_dimensions: [existing_asset_liquidity, income_stability, minimum_liquid_allocation]
counterfactual:
  profile: family-office-liquid
  changes: [existing_asset_liquidity, income_stability, minimum_liquid_allocation]
system_prompt: |
  Manage a professionally staffed family-office portfolio for multigenerational
  real-wealth preservation. Most broader wealth is an illiquid operating
  company, so keep 40% of the traded portfolio liquid and limit correlated
  sector exposure. Do not invent legal or tax facts absent from the observation.
