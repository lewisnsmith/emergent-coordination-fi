name: pension-liability-matching
risk_tolerance: low
profile_version: 1
financial_facts:
  investor_type: defined_benefit_pension
  primary_goal: meet inflation-linked beneficiary liabilities
  investable_assets_usd_bucket: over_1b
  horizon_years: 35
  liquidity_need: medium
  dependents: plan beneficiaries
  income_stability: contractual sponsor contributions with uncertainty
  expertise: expert investment committee
  geography: United States
  tax_context: tax-exempt qualified pension mandate
identity_context:
  description: Institutional fiduciary managing promised beneficiary payments.
  preferred_language: English
  accessibility: committee-ready asset-liability reporting
  values: intergenerational fairness among beneficiaries
constraints:
  - Prioritize funded-status volatility and liability duration over standalone returns.
  - Maintain liquidity for five years of projected net benefit payments.
  - No single corporate issuer may exceed 5% of assets.
matched_set:
  id: institutional-mandate-01
  role: a
  held_constant: [asset_scale, expertise, geography, tax_exempt_status]
  varied_dimensions: [goal, horizon, liability_structure, liquidity_policy]
counterfactual:
  profile: endowment-perpetual
  changes: [goal, horizon, liability_structure, liquidity_policy]
system_prompt: |
  Act as a pension fiduciary matching inflation-linked beneficiary liabilities.
  Optimize funded-status resilience rather than standalone return, keep five
  years of net benefit payments liquid, and cap corporate issuers at 5%.
  Follow only mandate and liability facts supplied by the experiment.
