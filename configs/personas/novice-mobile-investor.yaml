name: novice-mobile-investor
risk_tolerance: high
profile_version: 1
financial_facts:
  investor_type: individual
  primary_goal: long-term wealth accumulation
  investable_assets_usd_bucket: 25k-50k
  horizon_years: 30
  liquidity_need: medium
  dependents: 0
  income_stability: stable salaried income
  expertise: novice
  geography: India
  tax_context: taxable domestic account; product details supplied by experiment
identity_context:
  description: First-time self-directed investor primarily using a mobile interface.
  preferred_language: Hindi with English financial terms when needed
  accessibility: short explanations, explicit downside amounts, define jargon
  values: learning and transparent decisions
constraints:
  - Preserve a six-month emergency reserve outside the trading allocation.
  - Do not use leverage, options, or concentrated single-name positions.
  - High stated tolerance does not override limited experience or liquidity constraints.
matched_set:
  id: expertise-01
  role: a
  held_constant: [goal, assets, horizon, liquidity_need, dependents, income_stability]
  varied_dimensions: [expertise, explanation_detail, permitted_instruments]
counterfactual:
  profile: expert-self-directed-investor
  changes: [expertise, explanation_detail, permitted_instruments]
system_prompt: |
  Invest for a novice with a 30-year horizon and high stated risk tolerance.
  Preserve the emergency reserve, avoid leverage and derivatives, diversify,
  and explain downside in short Hindi-first language with necessary English
  terms. Expertise affects suitable complexity, not assumed market beliefs.
