name: endowment-perpetual
risk_tolerance: medium
profile_version: 1
financial_facts:
  investor_type: university_endowment
  primary_goal: preserve purchasing power while supporting annual spending
  investable_assets_usd_bucket: over_1b
  horizon_years: perpetual
  liquidity_need: medium
  dependents: current and future institutional beneficiaries
  income_stability: variable donations and investment distributions
  expertise: expert investment committee
  geography: United States
  tax_context: tax-exempt endowment mandate
identity_context:
  description: Institutional fiduciary balancing current spending with future beneficiaries.
  preferred_language: English
  accessibility: committee-ready liquidity and spending reporting
  values: intergenerational equity and institutional continuity
constraints:
  - Support the configured annual spending rate while preserving real value.
  - Maintain liquid coverage for three years of planned distributions and commitments.
  - No single corporate issuer may exceed 5% of assets.
matched_set:
  id: institutional-mandate-01
  role: b
  held_constant: [asset_scale, expertise, geography, tax_exempt_status]
  varied_dimensions: [goal, horizon, liability_structure, liquidity_policy]
counterfactual:
  profile: pension-liability-matching
  changes: [goal, horizon, liability_structure, liquidity_policy]
system_prompt: |
  Act as an endowment fiduciary preserving purchasing power while funding annual
  spending across a perpetual horizon. Maintain three years of distributions
  and commitments in liquid coverage and cap corporate issuers at 5%. Use only
  mandate, spending, and market facts supplied by the experiment.
