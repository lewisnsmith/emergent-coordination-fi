# H1/H3/H4 on real equities. Requires:
#   uv sync --extra providers --extra data
#   uv run flock data build equities --symbols AAPL,MSFT,NVDA,AMZN,GOOGL --start 2023-01-01 --end 2024-12-31
# Swap/extend models per configs/models.yaml. Sweep seeds via configs/sweeps/.
name: exp-001-replay-equities
seed: 42
dataset: equities-daily
market:
  kind: replay
  fee_bps: 5
  slippage_bps: 2
steps: 120
observation_window: 20
initial_cash: 100000
max_position_per_symbol: 1000
cohorts:
  - name: llm
    agents:
      - { kind: llm, model: claude-sonnet, persona: neutral, count: 2, temperature: 0.7 }
      - { kind: llm, model: claude-haiku, persona: neutral, count: 2, temperature: 0.7 }
      - { kind: llm, model: gpt-5, persona: neutral, count: 2, temperature: 0.7 }
      - { kind: llm, model: gemini-pro, persona: neutral, count: 2, temperature: 0.7 }
  - name: baseline
    agents:
      - { kind: momentum, count: 2 }
      - { kind: mean_reversion, count: 2 }
      - { kind: market_maker, count: 2 }
      - { kind: buy_hold, count: 1 }
      - { kind: random, count: 1 }
  - name: "null"
    agents:
      - { kind: random, count: 8 }
