# H5: emergent coordination with price impact. Same cohorts as exp-000 but
# trading in a step-synchronous price-time-priority call process with an
# intra-step limit-order book. Offline (mocks); H5 validation remains gated.
name: exp-010-shared-exchange
model_policy: mock_only
runtime_budget:
  max_requests: 480        # 6 mock LLMs x 40 steps x one format repair
  max_input_tokens: 5000000
  max_output_tokens: 500000
  max_cost_usd: 1.0
  request_cost_reserve_usd: 0.01
hypothesis_ids: [H5]
independent_block: synthetic-exchange-seed-42
seed: 42
dataset: synthetic-equities-v1
market:
  kind: exchange
  fee_bps: 5
  tick_size: 0.01
steps: 40
observation_window: 20
initial_cash: 100000
initial_position_per_symbol: 200   # endowment so the sell side exists (long-only market)
max_position_per_symbol: 1000
cohorts:
  - name: llm
    agents:
      - { kind: llm, model: mock-momentum, persona: neutral, count: 4, temperature: 0.7, grounding_mode: audit }
      - { kind: llm, model: mock-momentum-noisy, persona: neutral, count: 2, temperature: 0.7, grounding_mode: audit }
  - name: baseline
    agents:
      - { kind: momentum, count: 1 }
      - { kind: mean_reversion, count: 2 }
      - { kind: market_maker, count: 2 }
      - { kind: buy_hold, count: 1 }
  - name: "null"
    agents:
      - { kind: random, count: 6 }
