# Added after the scenario ceilings were calculated. This sidecar is excluded
# from every scenarios.* total until exact checkpoints, throughput, endpoints,
# measured tokens, retries, and dollar caps are frozen.
sidecars:
  h13_local_fidelity_pilot:
    scope: future_program
    hypotheses: [H8, H13]
    experiments: [exp-025, exp-026]
    included_in_scenario_totals: false
    local_precision_screen:
      families: 2
      sizes_per_family: 2
      precisions: [bf16_or_fp16, gptq_w8a16, gptq_w4a16, gptq_w3a16_stress]
      dependency_depths: [2, 4, 8, 16]
      items_per_depth_cell_cap: 50
      free_running_chains: 3200
      gold_prefix_scored_steps: 24000
      pricing_status: benchmark_required
    frontier_bridge:
      endpoints: 2
      held_out_financial_chains: 384
      chain_calls: 768
      repeated_fraction: 0.10
      extra_repeats: 2
      repeat_calls_rounded: 154
      replay_blocks: 12
      replay_steps: 30
      agents_per_endpoint: 4
      replay_calls: 2880
      api_call_cap_before_repairs: 3802
      pricing_status: canary_measurement_required
    independent_unit_plan:
      discovery_clusters: { min: 8, max: 12 }
      confirmatory_clusters: { min: 24, max: 32 }
      blinded_hard_cap_clusters: 48
    mechanistic_gpu_hours:
      discovery_cap: 24
      confirmation_cap: 80
      confirmation_requires_behavioral_gate: true
