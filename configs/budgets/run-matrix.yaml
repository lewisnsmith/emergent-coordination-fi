# Staged, non-Cartesian execution budget for the full research program.
# Six endpoints are balanced inside cells: five paid APIs and one local model.
# The 24 personas and five prompt variants are assigned by the designs below;
# they are not multiplied across every MPHIQ cell.
# Trust/adoption calls prepare LLM-generated study stimuli only. Human
# participant recruitment, compensation, IRB/ethics review, administration,
# and survey operations are excluded and TBD.
scenarios:
  pilot:
    description: "Stop/go pilot using three seeds and short replay windows."
    components:
      mphiq_screen:
        scope: first_paper
        hypotheses: [H1, H3, H4]
        formula: "32 schemes * 1 environment * 3 seeds * 60 steps * 8 LLM agents"
        calls: 46080
      semantic_equivalence:
        scope: first_paper
        hypotheses: [H1, H3, H4]
        formula: "4 headline schemes * 5 prompt variants * 1 environment * 3 seeds * 60 steps * 8 LLM agents"
        calls: 28800
      prompt_pressure_fractional:
        scope: future_program
        hypotheses: [H12]
        formula: "16 fractional-factorial cells * 1 environment * 3 seeds * 60 steps * 8 LLM agents"
        calls: 23040
      exchange_ai_share:
        scope: separate_h5
        hypotheses: [H5]
        formula: "6 AI-capital shares * 1 simulated regime * 3 seeds * 80 steps * 8 LLM agents"
        calls: 11520
      trust_and_delegation:
        scope: future_program
        hypotheses: [H6]
        formula: "6 endpoints * 24 personas * 5 prompt variants * 12 vignettes * 3 repeats"
        calls: 25920
    scoped_calls:
      first_paper: { incremental: 74880, prior_stage: 0, total: 74880 }
      separate_h5: { incremental: 11520, prior_stage: 0, total: 11520 }
      future_program: { incremental: 48960, prior_stage: 0, total: 48960 }
    incremental_calls: 135360
    prior_stage_calls: 0
    total_calls: 135360
    api_local_split:
      api_fraction: 0.8333333333333334
      local_fraction: 0.16666666666666666
      api_decisions_before_retries: 112800
      local_decisions: 22560
      api_requests_after_stage_retries: 113928
    token_cases:
      low: { input_tokens: 1200, output_tokens: 150 }
      expected: { input_tokens: 2200, output_tokens: 350 }
      high: { input_tokens: 4000, output_tokens: 800 }
    selected_token_case: low
    retry_rate: 0.01
    local_gpu_hours:
      serving: { min: 50, max: 120 }
      mechanistic_pilot_1xh100: { min: 80, max: 160 }
      total_h100_gpu_hours: { min: 130, max: 280 }
    storage_cpu_assumptions:
      ordinary_results_gb: 10
      temporary_activation_storage_gb: 500
      activation_storage_months: 1
      analysis_vm: gcp-e2-standard-4
      analysis_vm_hours: 250
      estimated_auxiliary_usd: 110
    estimated_standard_api_usd:
      through_2026_08_31: 858.90
      from_2026_09_01: 916.66
    recommended_credit_envelope_usd:
      api: 1100
      gpu_vm: 1000
      cpu_storage: 200
      total: 2300

  base:
    description: "Contingent ten-seed ceiling, authorized only after the pilot passes stop/go gates."
    components:
      mphiq_confirmation:
        scope: first_paper
        hypotheses: [H1, H3, H4]
