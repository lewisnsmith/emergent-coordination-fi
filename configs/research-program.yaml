    status: scaffolded
    estimand: Causal decision change under activation patching, ablation, and steering.
    independent_unit: Observation by local checkpoint by intervention seed.
    inputs: [hookable local frontier checkpoint, activation hooks, feature dictionary]
    treatments: [activation patching, causal tracing, ablation, steering]
