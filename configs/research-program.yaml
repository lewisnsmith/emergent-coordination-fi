    hypotheses: [H8, H12]
    mode: black_box_interpretability
    question: Which supplied facts causally alter frontier API model investment decisions?
    status: scaffolded
    estimand: Paired decision change under controlled feature masks and counterfactual replacements.
    independent_unit: Observation-prompt-model intervention block.
    inputs: [frontier API models, feature intervention catalog]
    treatments: [feature masking, value replacement, order and salience perturbation]
    controls: [sham masks, negative-control features, semantically neutral rewrites]
    inference: [paired intervention test, Holm correction by feature family]
    dependencies: [counterfactual prompt runner, attribution analysis]
    executable_configs: []
