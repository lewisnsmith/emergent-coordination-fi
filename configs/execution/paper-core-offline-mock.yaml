schema_version: 1
execution_mode: offline_mock

# Every frozen trajectory/window is deliberately redirected to the same verified
# local fixture. This preserves study topology for pipeline rehearsal only; it
# does not simulate distinct markets or create paper-eligible evidence.
trajectory_datasets:
  synthetic-trend-2026-v1: synthetic-equities-v1
  synthetic-reversal-2026-v1: synthetic-equities-v1
  equities-2018-h1-v1: synthetic-equities-v1
  equities-2019-h2-v1: synthetic-equities-v1
  equities-2020-crisis-v1: synthetic-equities-v1
  equities-2022-bear-v1: synthetic-equities-v1
  exchange-trend-2026-v1: synthetic-equities-v1
  exchange-stress-2026-v1: synthetic-equities-v1

# One-to-one substitutions keep the four-level M factor distinguishable while
# retaining each source allocation and dated revision in RunAssignment.
mock_model_registry_keys:
  claude-opus-4-8: mock-momentum
  claude-sonnet-5: mock-momentum-noisy
  gpt-5.6-sol: mock-contrarian
  gemini-3.1-pro-20260713: mock-random

baseline_kinds:
  momentum-strategy-v1: momentum
  mean-reversion-strategy-v1: mean_reversion
  market-maker-strategy-v1: market_maker
  buy-hold-strategy-v1: buy_hold
  seeded-random-strategy-v1: random

stage_defaults:
  provider-canary: &replay_defaults
    market: {kind: replay, fee_bps: 5.0, slippage_bps: 2.0}
    observation_window: 20
    initial_cash: 100000.0
    initial_position_per_symbol: 0.0
    max_position_per_symbol: 1000.0
    persona_id: neutral
    prompt_id: neutral-paraphrase-01
    grounding_mode: audit
  calibration-replay: *replay_defaults
  confirmatory-replay: *replay_defaults
  mphiq-factorial:
    market: {kind: replay, fee_bps: 5.0, slippage_bps: 2.0}
    observation_window: 20
    initial_cash: 100000.0
    initial_position_per_symbol: 0.0
    max_position_per_symbol: 1000.0
    grounding_mode: audit
  h5-capital-share:
    market: {kind: exchange, fee_bps: 5.0, tick_size: 0.01}
    observation_window: 20
    initial_cash: 100000.0
    initial_position_per_symbol: 100.0
    max_position_per_symbol: 1000.0
    persona_id: neutral
    prompt_id: neutral-paraphrase-01
    grounding_mode: audit

mphiq_levels:
  mphiq-factorial:
    persona_ids:
      - neutral
      - institutional-quant
      - institutional-value
      - expert-self-directed-investor
    harness_presets:
      - {level_id: mock-harness-00, temperature: 0.0, memory: false, harness_id: mock-h00}
      - {level_id: mock-harness-01, temperature: 0.3, memory: true, harness_id: mock-h01}
      - {level_id: mock-harness-02, temperature: 0.7, memory: false, harness_id: mock-h02}
      - {level_id: mock-harness-03, temperature: 1.0, memory: true, harness_id: mock-h03}
    information_policies:
      - shared-all
      - no-news
      - news-partition-a
      - news-partition-b
    prompt_ids:
      - neutral-paraphrase-01
      - neutral-paraphrase-02
      - neutral-paraphrase-03
      - neutral-paraphrase-04
    prompt_semantic_group: core-neutral-investment-task-v1

disabled_stages:
  h5-capital-share: >-
    ExperimentConfig cannot represent randomized AI/background capital shares;
    H5 remains simulator-gated and is terminally blocked in the mock ledger.
