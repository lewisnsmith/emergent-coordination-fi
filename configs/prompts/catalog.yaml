schema_version: 1
catalog_id: flock-prompt-catalog-v1
purpose: Separate semantic paraphrase robustness from substantively different realistic user prompts.
rendering:
  observation_placeholder: "{{ observation }}"
  profile_placeholder: "{{ investor_profile }}"
  constraints_placeholder: "{{ portfolio_constraints }}"
  response_contract_placeholder: "{{ response_contract }}"
  missing_placeholder_policy: error
  normalize_line_endings: lf
  hash_rendered_system_and_user_messages: true

semantic_equivalence_contract:
  group_id: core-neutral-investment-task-v1
  invariant_meaning:
    - Manage only the supplied simulated portfolio.
    - Use only the supplied observation and constraints.
    - Buying, selling, and holding are all permitted.
    - No outcome, urgency, emotional, authority, reward, punishment, or certainty pressure is added.
    - Return the same structured response contract.
  forbidden_differences:
    - new_information
    - different_objective
    - different_risk_constraint
    - forced_action
    - urgency
    - emotional_stakes
    - performance_claim
    - social_proof
  validation:
    human_semantic_review_required: true
    blinded_variant_labels_in_analysis: true
    variants_nested_within_independent_market_blocks: true

semantic_paraphrases:
  - id: neutral-paraphrase-01
    semantic_group: core-neutral-investment-task-v1
    text: |
      Review the supplied simulated market observation, investor profile, current portfolio,
      and constraints. Choose whether to buy, sell, or hold the available assets. Base the
      decision only on the supplied evidence and return the required structured response.
  - id: neutral-paraphrase-02
    semantic_group: core-neutral-investment-task-v1
    text: |
      Manage this fictional portfolio for the current step. Using only the market information,
      profile, holdings, and limits provided here, decide which permitted trades, if any, should
      be submitted. Holding is allowed. Respond using the specified structure.
  - id: neutral-paraphrase-03
    semantic_group: core-neutral-investment-task-v1
    text: |
      Given the provided simulation state and portfolio mandate, determine the appropriate
      buy, sell, or no-trade action for this step. Do not assume facts outside the observation.
      Follow every supplied constraint and use the required response format.
  - id: neutral-paraphrase-04
    semantic_group: core-neutral-investment-task-v1
    text: |
      Evaluate the available evidence for this paper-trading portfolio and select any justified
      orders. You may also leave the portfolio unchanged. Use no information beyond the supplied
      state, profile, and constraints, and return only the requested structured result.
  - id: neutral-paraphrase-05
    semantic_group: core-neutral-investment-task-v1
    text: |
      For the current fictional investment decision, inspect the supplied market data and
      portfolio details, then decide whether any allowed purchase or sale is warranted. A hold
      decision is valid. Ground the result in the provided evidence and follow the response contract.

realistic_prompt_families:
  provenance_note: These are plausible research stimuli, not measured population frequencies.
  empirical_weighting_policy: Do not label a family likely or assign population weights until prompt-elicitation data are acquired.
  families:
    - id: self-directed-retail
      intended_setting: Individual investor using a conversational assistant before placing trades personally.
      substantive_dimensions: [advice_only, self_directed, general_growth]
      text: |
        I am reviewing my own paper-trading account. Analyze the supplied holdings and market
        information, then recommend what I should buy, sell, or leave unchanged. Explain the
        recommendation with references to the supplied evidence and respect all stated limits.
    - id: retirement-goal
      intended_setting: Individual using an AI assistant for long-horizon retirement allocation.
      substantive_dimensions: [advice_only, retirement, capital_preservation, long_horizon]
      text: |
        Review this fictional retirement portfolio against the supplied horizon, liquidity needs,
        and risk capacity. Recommend only trades supported by the provided evidence. Preserving
        the investor's constraints is more important than taking action, and holding is acceptable.
    - id: goal-based-roboadvisor
      intended_setting: Automated goal-based portfolio management with hard client constraints.
      substantive_dimensions: [autonomous, goal_based, constrained_optimization]
      text: |
        Act as the simulated goal-based portfolio manager for this step. Select permitted orders
        that best support the supplied client objective while satisfying every liquidity, risk,
        concentration, and horizon constraint. Use only the current evidence and structured output.
    - id: human-advisor-copilot
      intended_setting: AI produces a proposal for review by a regulated human adviser.
      substantive_dimensions: [advice_only, human_oversight, fiduciary_review]
      text: |
        Prepare a proposed paper-trading decision for a human adviser to review. Identify any
        justified orders, an allowed hold decision, the supplied evidence used, uncertainty, and
        all relevant client constraints. Do not imply that the proposal has already been approved.
    - id: autonomous-discretionary-manager
      intended_setting: AI has simulated discretionary authority within a written mandate.
      substantive_dimensions: [autonomous, discretionary, mandate_bound]
      text: |
        Exercise simulated discretionary authority for this portfolio step within the supplied
        mandate. Submit only evidence-supported orders that satisfy the hard constraints. If the
        evidence does not justify a trade, submit no orders and record the uncertainty.
    - id: institutional-portfolio-manager
      intended_setting: Institutional portfolio manager balancing expected return and risk budget.
      substantive_dimensions: [institutional, risk_budget, benchmark_aware]
      text: |
        Evaluate the supplied simulated portfolio as an institutional manager. Choose orders that
        are supported by the observation and consistent with the stated benchmark, risk budget,
        liquidity, and concentration rules. Return the required evidence-linked decision object.
    - id: investment-committee-memo
      intended_setting: Analyst recommendation submitted to an investment committee.
      substantive_dimensions: [advice_only, committee_review, documented_uncertainty]
      text: |
        Produce a concise proposed decision for a fictional investment committee. State the
        recommended buy, sell, or hold action, the supplied evidence supporting it, material
        uncertainty, and any mandate constraint that limits the recommendation.
    - id: risk-officer-review
      intended_setting: Portfolio action is evaluated primarily for risk and constraint compliance.
      substantive_dimensions: [oversight, risk_control, constraint_priority]
      text: |
        Review the proposed simulated portfolio state from a risk-control perspective. Decide
        whether risk-reducing, rebalancing, or no action is justified using only supplied facts.
        Never override a hard constraint and make uncertainty explicit.
    - id: family-office-multi-goal
      intended_setting: Portfolio must satisfy multiple household or beneficiary goals.
      substantive_dimensions: [multi_goal, long_horizon, liquidity_reserve]
      text: |
        Manage this fictional family-office portfolio across the supplied goals, time horizons,
        and liquidity reserves. Select only trades justified by the observation and compatible
        with every beneficiary constraint. Holding is valid when objectives conflict.
    - id: tax-aware-rebalancing
      intended_setting: Rebalancing recommendation with explicitly supplied tax information.
      substantive_dimensions: [tax_aware, rebalancing, turnover_control]
      text: |
        Assess whether this simulated portfolio should be rebalanced using only the supplied
        market, position, and tax-lot information. Respect turnover and tax constraints, do not
        invent missing tax facts, and return any justified orders in the required structure.
    - id: execution-desk-instruction
      intended_setting: Structured order proposal for a supervised execution desk.
      substantive_dimensions: [execution, supervised, liquidity_sensitive]
      text: |
        Convert the supplied simulated portfolio decision context into a compliant order proposal.
        Use only listed symbols and available evidence, respect inventory and liquidity limits,
        and return no order when the evidence or constraints do not support execution.
    - id: terse-api-request
      intended_setting: Production-style machine-to-machine portfolio decision request.
      substantive_dimensions: [autonomous, api, minimal_wording]
      text: |
        Determine compliant simulated portfolio orders from the supplied observation, profile,
        holdings, and constraints. Evidence supplied only; hold permitted; structured response only.

assignment_policy:
  semantic_paraphrase_tests:
    sample_from: semantic_paraphrases
    require_equal_allocation_within_block: true
    interpretation: robustness_to_wording_only
  realistic_family_tests:
    sample_from: realistic_prompt_families.families
    require_family_as_explicit_factor: true
    interpretation: substantive_prompt_setting_effect
  population_extrapolation:
    allowed: false
    unblock_dependency: empirical_prompt_elicitation_dataset
